<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden}

.card{position:relative;width:1280px;height:640px;background:#16181D;
  padding:72px 96px;font-family:'IBM Plex Mono',monospace}
.win{position:absolute;inset:72px 96px;background:#1D2026;border:1px solid #23262D;
  border-radius:10px;overflow:hidden}
.bar{height:44px;background:#23262D;display:flex;align-items:center;padding:0 18px;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:#3A3E46}
.bar .wtitle{margin:0 auto;font:400 13px/1 'IBM Plex Mono',monospace;color:#8B8F98;
  letter-spacing:.08em}
.body{padding:44px 48px 0}
.prompt{font:400 18px/1 'IBM Plex Mono',monospace;color:#8B8F98}
.prompt .sym{color:#C084FC}
.title{font-weight:600;color:#E6E3DC;font-size:92px;
  letter-spacing:-.01em;line-height:1.06;margin-top:26px}
.title .cursor{display:inline-block;width:.5em;height:.9em;background:#C084FC;
  vertical-align:-.08em;margin-left:10px}
.desc{font:400 21px/1.7 'IBM Plex Mono',monospace;color:#8B8F98;
  margin-top:26px;max-width:880px}
.status{position:absolute;left:48px;right:48px;bottom:32px;border-top:1px solid #23262D;
  padding-top:18px;display:flex;justify-content:space-between;
  font:400 14px/1 'IBM Plex Mono',monospace;color:#8B8F98;letter-spacing:.1em}

</style></head><body><div class="card"><div class="win">
<div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
<span class="wtitle">charmbracelet/freeze · zsh</span></div>
<div class="body">
<div class="prompt"><span class="sym">&#10095;</span> gh repo view charmbracelet/freeze</div>
<h1 class="title">freeze<span class="cursor"></span></h1>
<p class="desc">Generate images of code and terminal output. Crisp SVG and PNG straight from your shell.</p>
</div>
<div class="status"><span>GO · MIT</span><span>EXIT 0</span></div>
</div></div></body></html>
