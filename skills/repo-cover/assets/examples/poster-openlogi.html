<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden}

.card{position:relative;width:1280px;height:640px;background:#3C281A;
  padding:118px 88px 0;overflow:hidden}
.glyph{position:absolute;right:-48px;bottom:-190px;font-family:'Fraunces',serif;
  font-weight:600;font-size:660px;line-height:1;color:#FAF6EE;opacity:.07;
  font-variation-settings:'opsz' 144}
.eyebrow{font:500 15px/1 'IBM Plex Mono',monospace;letter-spacing:.22em;
  text-transform:uppercase;color:#FAF6EE;opacity:.72}
.title{font-family:'Fraunces',serif;font-weight:560;color:#FAF6EE;
  font-size:132px;letter-spacing:-.015em;line-height:1.04;
  margin-top:38px;font-variation-settings:'opsz' 144}
.title .stop{color:#D5B9A7}
.desc{font:400 29px/1.5 'Noto Sans KR',sans-serif;color:#FAF6EE;opacity:.78;
  margin-top:34px;max-width:640px}
.meta{position:absolute;left:88px;right:88px;bottom:64px;
  border-top:1px solid rgba(250,246,238,.22);padding-top:22px;display:flex;gap:44px;
  font:500 15px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;
  text-transform:uppercase;color:#FAF6EE;opacity:.85}

</style></head><body><div class="card">
<div class="glyph">O</div>
<div class="eyebrow">AprilNEA</div>
<h1 class="title">OpenLogi<span class="stop">.</span></h1>
<p class="desc">A native, <span style="white-space:nowrap">local-first</span> manager for Logitech devices. No account. No telemetry. No Electron.</p>
<div class="meta"><span class="item"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#D5B9A7;margin-right:10px;vertical-align:-1px"></span>Rust</span><span class="item">GPL-3.0</span></div>
</div></body></html>
